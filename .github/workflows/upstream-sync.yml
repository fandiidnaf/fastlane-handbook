name: Fastlane Upstream Release Watcher & Sync

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-and-sync:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Latest Fastlane Version
        id: fastlane-remote
        run: |
          LATEST_V=$(curl -s https://rubygems.org/api/v1/versions/fastlane/latest.json | jq -r .version)
          echo "version=${LATEST_V}" >> "$GITHUB_OUTPUT"
          echo "Upstream Fastlane version on RubyGems: ${LATEST_V}"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Cache Fastlane Gem
        uses: actions/cache@v6
        id: gem-cache
        with:
          path: |
            ~/.gem
            ~/.local/share/gem
          key: ${{ runner.os }}-gem-fastlane-${{ steps.fastlane-remote.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-gem-fastlane-

      - name: Install Fastlane
        run: |
          gem install fastlane --user-install --no-document
          echo "$(gem environment user_gemhome)/bin" >> "$GITHUB_PATH"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun Dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install Node Dependencies
        run: bun install --frozen-lockfile

      - name: Extract Actions & Generate Docs
        run: |
          ruby scripts/extract-actions.rb
          bun run scripts/generate-action-docs.ts

      - name: Check for Changes
        id: git-check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and Push Upstream Updates
        if: steps.git-check.outputs.changes_detected == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          LATEST_VERSION=$(bun -e 'console.log(require("./src/data/fastlane-version.json").fastlane_version)')
          git add src/data/ src/content/docs/actions/ src/content/docs/deprecated-actions/ src/content/docs/actions-by-platform.mdx
          git commit -m "chore(upstream): sync fastlane actions to v${LATEST_VERSION}"
          git push origin main

      - name: Trigger deploy.yml to rebuild GitHub Pages
        if: steps.git-check.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main
